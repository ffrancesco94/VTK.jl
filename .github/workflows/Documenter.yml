name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Allow Documenter to push to gh-pages via GITHUB_TOKEN as a fallback.
permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v3

      # VitePress (DocumenterVitepress.jl renders the site with node).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The WrapIt-driven generator builds wrapit from source and needs
      # libclang + OpenSSL headers (cmake/git/g++ are preinstalled).
      - name: Install libclang + OpenSSL headers (wrapit build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang libssl-dev

      # Ubuntu keeps libclang.so under /usr/lib/llvm-*/lib, outside CMake's
      # default find_library path; derive CLANG_PREFIX from the installed
      # clang's resource dir (wrapit_src.jl forwards it as -DCLANG_PREFIX).
      - name: Detect CLANG_PREFIX for wrapit
        run: |
          res="$(clang -print-resource-dir)"   # e.g. /usr/lib/llvm-18/lib/clang/18
          echo "VTKJL_CLANG_PREFIX=${res%/lib/clang/*}" >> "$GITHUB_ENV"

      # VTK.jl's docs do `using VTK`, which needs the compiled C++ wrapper.
      # ubuntu-latest ships g++; VTK itself comes from VTK_jll. The default
      # build is the WrapIt-driven generator (gen/build_wrapper.jl).
      - name: Instantiate project and build C++ wrapper
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen/wrapit -e 'using Pkg; Pkg.instantiate()'
          julia --project=. gen/build_wrapper.jl

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCS_DEPLOY: "true"
        run: julia --project=docs docs/make.jl
